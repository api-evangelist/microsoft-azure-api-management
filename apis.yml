apis:
- aid: microsoft-azure-api-management:azure-api-center
  name: Azure API Center
  description: >-
    Azure API Center is the design-time governance and centralized discovery counterpart to Azure API
    Management. It enables organizations to track all of their APIs - regardless of type, lifecycle stage,
    or deployment location - along with version details, OpenAPI definitions, and metadata, for inventory,
    reuse, and governance. API Center registers APIs managed in Azure API Management and other gateways,
    supports linting and breaking-change detection in Visual Studio Code, and includes a private API Center
    portal and an MCP server registry. Customers with a linked API Management Standard, Standard v2, Premium,
    or Premium v2 instance can use the API Center Standard plan at no additional cost.
  humanURL: https://learn.microsoft.com/en-us/azure/api-center/overview
  baseURL: https://management.azure.com/
