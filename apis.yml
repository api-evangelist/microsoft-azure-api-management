aid: microsoft-azure-api-management
name: Microsoft Azure API Management
description: Microsoft Azure API Management is a hybrid, multicloud management platform for APIs across all environments.
  It is composed of an API gateway (data plane), a management plane, and a developer portal, and supports the complete
  API lifecycle for publishing, securing, monitoring, and transforming APIs for external, partner, and internal developers.
  It now includes an AI gateway for governing OpenAI Chat Completions, OpenAI Responses, Anthropic Messages, Microsoft
  Foundry models, Amazon Bedrock, MCP servers exposed from REST APIs or proxied from external MCP backends, and A2A agent
  APIs - with token rate limiting, semantic caching, content safety, backend load balancing, circuit breakers, and token
  emission to Application Insights. It pairs with Azure API Center for design-time inventory, governance, and discovery.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
