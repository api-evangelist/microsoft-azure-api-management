- aid: microsoft-azure-api-management:azure-api-management-ai-gateway
  name: Azure API Management AI Gateway
  description: The Azure API Management AI gateway extends the existing API gateway with capabilities to manage, secure,
    scale, monitor, and govern AI backends. Supported AI API schemas include OpenAI Chat Completions, OpenAI Responses,
    and Anthropic Messages (v2 tiers). It governs language model APIs deployed in Microsoft Foundry, non-Microsoft
    providers such as Amazon Bedrock, self-hosted models, remote MCP servers, and A2A agent APIs. Core capabilities
    include the llm-token-limit policy for TPM rate limiting and quotas, semantic caching with Azure Managed Redis,
    backend load balancing (round-robin, weighted, priority, session-aware) with dynamic circuit breakers, content
    safety enforcement via Azure AI Content Safety, and token-metric emission to Application Insights.
  humanURL: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
  baseURL: https://management.azure.com/
