openapi: 3.2.0
info:
  title: Azure API Management Developer Portal Products API
  description: The developer portal is a customizable website for API consumers to discover APIs, read documentation, test APIs via an interactive console, create accounts, subscribe to products, and manage API keys.
  version: '2024-05-01'
  contact:
    name: Microsoft Azure
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-developer-portal-customize
servers:
- url: https://{service-name}.developer.azure-api.net
tags:
- name: Products
paths:
  /products:
    get:
      summary: List available products
      operationId: DevPortal_ListProducts
      tags:
      - Products
      description: Returns the list of API products available for subscription.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                ProductListExample:
                  summary: List of products
                  value:
                    count: 1
                    value:
                    - id: starter-product
                      name: Starter
                      description: Free tier with rate-limited access to all APIs.
                      subscriptionRequired: true
                      approvalRequired: false
              x-microcks-default:
                count: 1
components:
  schemas:
    ProductSummary:
      type: object
      properties:
        id:
          type: string
          example: starter-product
        name:
          type: string
          example: Starter
        description:
          type: string
          example: Free tier with rate-limited access to all APIs.
        subscriptionRequired:
          type: boolean
          example: true
        approvalRequired:
          type: boolean
          example: false
    ProductList:
      type: object
      properties:
        count:
          type: integer
          example: 1
        value:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
