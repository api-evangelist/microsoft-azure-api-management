openapi: 3.2.0
info:
  title: Azure API Management Developer Portal Authentication API
  description: The developer portal is a customizable website for API consumers to discover APIs, read documentation, test APIs via an interactive console, create accounts, subscribe to products, and manage API keys.
  version: '2024-05-01'
  contact:
    name: Microsoft Azure
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-developer-portal-customize
servers:
- url: https://{service-name}.developer.azure-api.net
tags:
- name: Authentication
paths:
  /signin:
    get:
      summary: Sign in page
      operationId: DevPortal_SignIn
      tags:
      - Authentication
      description: Returns the sign in page for developer authentication.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      responses:
        '200':
          description: Sign in page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPage'
              examples:
                SignInPage:
                  summary: Sign in page
                  value:
                    title: Sign In
                    description: Sign in with your developer account.
              x-microcks-default:
                title: Sign In
  /signup:
    get:
      summary: Sign up page
      operationId: DevPortal_SignUp
      tags:
      - Authentication
      description: Returns the sign up page for new developer account registration.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      responses:
        '200':
          description: Sign up page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPage'
              examples:
                SignUpPage:
                  summary: Sign up page
                  value:
                    title: Sign Up
                    description: Create a new developer account.
              x-microcks-default:
                title: Sign Up
components:
  schemas:
    PortalPage:
      type: object
      properties:
        title:
          type: string
          example: Contoso API Developer Portal
        description:
          type: string
          example: Welcome to the developer portal.
        links:
          type: array
          items:
            type: object
            properties:
              rel:
                type: string
                example: apis
              href:
                type: string
                example: /apis
externalDocs:
  description: Documentation
  url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-developer-portal-customize
x-generated-from: documentation
