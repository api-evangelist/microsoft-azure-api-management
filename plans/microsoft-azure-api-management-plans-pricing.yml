specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Azure API Management
providerId: microsoft-azure-api-management
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - API Gateway
  - API Management
  - Enterprise
  - Microsoft Azure
description: Azure API Management is offered in classic tiers (Consumption, Developer, Basic, Standard,
  Premium) and v2 tiers (Basic v2, Standard v2, Premium v2). Consumption is serverless and metered per
  call. All other tiers are billed hourly per scale unit. Prices vary by region; values below are typical
  US East list prices.
sources:
  - https://azure.microsoft.com/en-us/pricing/details/api-management/
  - https://learn.microsoft.com/en-us/azure/api-management/api-management-features
  - https://learn.microsoft.com/en-us/azure/api-management/v2-service-tiers-overview
plans:
  - id: microsoft-azure-api-management-consumption
    name: Consumption
    type: usage-based
    description: Serverless, pay-per-call API gateway. First 1M calls/month free, then per-call pricing.
      No SLA on calls below 1M; supports lightweight workloads.
    entries:
      - label: API calls (first 1M / month)
        name: consumption_free
        type: quota
        metric: call
        limit: 1000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: API calls (above 1M)
        name: consumption_paid
        type: metered
        metric: call
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000000
        price: '~$3.50 per 1M calls (region-varying); see Azure pricing page'
        userMultiplied: false
    elements:
      - name: Serverless auto-scaling
      - name: Pay-per-use
      - name: No dedicated capacity
  - id: microsoft-azure-api-management-developer
    name: Developer
    type: subscription
    description: Non-production tier for evaluation and dev/test. No SLA. One scale unit, full feature
      set.
    entries:
      - label: Per unit / hour
        name: developer_unit
        type: subscription
        metric: hour
        limit: -1
        timeFrame: hour
        geo: global
        unit: 1
        price: 'see Azure pricing calculator'
        userMultiplied: false
    elements:
      - name: All features (non-production)
      - name: 1 scale unit, no SLA
      - name: Self-hosted gateway support
  - id: microsoft-azure-api-management-basic
    name: Basic
    type: subscription
    description: Entry production tier. Up to 2 scale units. No virtual network injection.
    entries:
      - label: Per unit / hour
        name: basic_unit
        type: subscription
        metric: hour
        limit: 2
        timeFrame: hour
        geo: global
        unit: 1
        price: 'starts ~$0.21/hour (~$150/unit/month list); see Azure pricing page'
        userMultiplied: false
    elements:
      - name: Up to 2 scale units
      - name: 50 MB built-in cache
      - name: Production SLA
  - id: microsoft-azure-api-management-basic-v2
    name: Basic v2
    type: subscription
    description: Modernized v2 entry tier with autoscaling and faster provisioning. Up to 10 scale
      units.
    entries:
      - label: Per unit / hour
        name: basic_v2_unit
        type: subscription
        metric: hour
        limit: 10
        timeFrame: hour
        geo: global
        unit: 1
        price: 'see Azure pricing page (v2 tiers)'
        userMultiplied: false
    elements:
      - name: Autoscaling
      - name: Up to 10 scale units
      - name: 250 MB built-in cache
      - name: Faster provisioning vs classic Basic
  - id: microsoft-azure-api-management-standard
    name: Standard
    type: subscription
    description: Mid-tier production with broader feature support. Up to 4 scale units.
    entries:
      - label: Per unit / hour
        name: standard_unit
        type: subscription
        metric: hour
        limit: 4
        timeFrame: hour
        geo: global
        unit: 1
        price: 'starts ~$0.96/hour (~$700/unit/month list); see Azure pricing page'
        userMultiplied: false
    elements:
      - name: Up to 4 scale units
      - name: 1 GB built-in cache
      - name: Backup and restore
  - id: microsoft-azure-api-management-standard-v2
    name: Standard v2
    type: subscription
    description: Modernized v2 standard tier with autoscaling and outbound VNet integration.
    entries:
      - label: Per unit / hour
        name: standard_v2_unit
        type: subscription
        metric: hour
        limit: 10
        timeFrame: hour
        geo: global
        unit: 1
        price: 'see Azure pricing page (v2 tiers)'
        userMultiplied: false
    elements:
      - name: Outbound VNet integration
      - name: Up to 10 scale units
      - name: Autoscaling
  - id: microsoft-azure-api-management-premium
    name: Premium
    type: subscription
    description: Enterprise tier with multi-region deployment, VNet injection, self-hosted gateways,
      and workspaces. Up to 12 scale units per region.
    entries:
      - label: Per unit / hour (per region)
        name: premium_unit
        type: subscription
        metric: hour
        limit: 12
        timeFrame: hour
        geo: per-region
        unit: 1
        price: 'starts ~$3.83/hour (~$2,795/unit/month list); see Azure pricing page'
        userMultiplied: false
    elements:
      - name: Multi-region deployment
      - name: Virtual network injection
      - name: Self-hosted gateway
      - name: 5 GB built-in cache
      - name: Workspaces
      - name: 12 units per region
  - id: microsoft-azure-api-management-premium-v2
    name: Premium v2
    type: subscription
    description: v2 premium with availability zones and outbound VNet integration. Up to 30 scale
      units.
    entries:
      - label: Per unit / hour
        name: premium_v2_unit
        type: subscription
        metric: hour
        limit: 30
        timeFrame: hour
        geo: global
        unit: 1
        price: 'see Azure pricing page (v2 tiers)'
        userMultiplied: false
    elements:
      - name: Availability zones
      - name: Outbound VNet integration
      - name: Up to 30 scale units
      - name: Workspaces
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
