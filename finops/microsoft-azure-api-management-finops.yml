specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Microsoft Azure API Management
providerId: microsoft-azure-api-management
publisherName: Microsoft Azure API Management
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - AI Gateway
  - API Gateway
  - API Management
  - Enterprise
  - Microsoft Azure
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Microsoft Azure API Management API surface. Provides
  a FOCUS-aligned mapping for cost allocation, usage measurement, and unit-economics reporting across
  the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Microsoft Azure API Management
  ServiceCategory: Developer Tools / API
  ProviderName: Microsoft Azure API Management
  PublisherName: Microsoft Azure API Management
  InvoiceIssuerName: Microsoft Azure API Management
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Azure API Management REST API
    baseURL: https://management.azure.com/
    tags:
      - Azure Resource Manager
      - Configuration
      - Management Plane
      - REST
    serviceName: Azure API Management REST API
    serviceCategory: API
  - name: Azure API Management Gateway
    baseURL: https://azure-api.net
    tags:
      - API Gateway
      - Policies
      - Proxy
      - Traffic Management
    serviceName: Azure API Management Gateway
    serviceCategory: API
  - name: Azure API Management Self-Hosted Gateway
    baseURL: https://mcr.microsoft.com/product/azure-api-management/gateway
    tags:
      - Hybrid
      - Kubernetes
      - On-Premises
      - Self-Hosted
    serviceName: Azure API Management Self-Hosted Gateway
    serviceCategory: API
  - name: Azure API Management AI Gateway
    baseURL: https://management.azure.com/
    tags:
      - AI Gateway
      - Azure OpenAI
      - LLM
      - MCP
    serviceName: Azure API Management AI Gateway
    serviceCategory: API
  - name: Azure API Management Developer Portal
    baseURL: https://developer.azure-api.net
    tags:
      - API Discovery
      - Developer Portal
      - Documentation
      - Self-Service
    serviceName: Azure API Management Developer Portal
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
